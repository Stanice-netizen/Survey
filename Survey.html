<!DOCTYPE html>
<html>
    <head>
        <link rel="Stylesheet" href="style.css"/>
        <title>Survey Form</title>
    </head>
    <body>
        <header class="header" id="header">
        <h1 class="h1" style="text-align: center;">   FreeCodeCamp Survey Form   </h1>
        <em><p class="subtittle" style="text-align: center;">Thank you for taking the time to help us improve the platform</p></em></header>
        <main>
            <div Class="formbox">
        <form>
            <label for="name-input">Name:</label>
            <br>
            <input type="text" class="name-input" placeholder="Enter username"/>
            <br>
            <label for="email">Email:</label>
            <br>
            <input type="email" class="name-input" placeholder="Enter email"/>
            <br>
            <label for="age">Age:</label>
            <br>
            <input type="number" class="name-input" placeholder="Enter age"/>
            <br>
            <br>
            <label for="role">Which option best describes your current role?</label>
            <br>
            <select class="name-input">
                <option value="">Select current role</option>
                <option value="admin">Admin</option>
                <option value="editor">Editor</option>
                <option value="viewer">Viewer</option> 

            </select>
            <br>
            <br>
            <p>Would you recommend freeCodeCamp to a friend?</p>
            <input type="radio" id="option" name="option"/>
            <label for="option">Definitely</label>
            <br>
            <input type="radio" id="option" name="option"/>
            <label for="option">Maybe</label>
            <br>
            <input type="radio" id="option" name="option"/>    
            <label for="option">Not sure</label>
            <br>
            <br>
            <label for="feature">What is your favorite feature of freeCodeCamp?</label>
            <br>
            <select class="name-input">
                <option value="">Select an option</option>
                <option value="admin">Admin</option>
                <option value="editor">Editor</option>
                <option value="viewer">Viewer</option> 

            </select>
            <br>
            <p>What would you like to see improved? (check all that apply)</p>
            <input type="checkbox" id="option" name="option"/>
            <label for="option">Front-end Projects</label>
            <br>
            <input type="checkbox" id="option" name="option"/>
            <label for="option">Back-end Projects</label>
            <br>
            <input type="checkbox" id="option" name="option"/>    
            <label for="option">Data Visualization</label>
            <br>
            <input type="checkbox" id="option" name="option"/>
            <label for="option">Challenges</label>
            <br>
            <input type="checkbox" id="option" name="option"/>
            <label for="option">Open Source Community</label>
            <br>
            <input type="checkbox" id="option" name="option"/>    
            <label for="option">Gitter Help Rooms</label>
            <br>
            <input type="checkbox" id="option" name="option"/>
            <label for="option">Videos</label>
            <br>
            <input type="checkbox" id="option" name="option"/>
            <label for="option">City Meetups</label>
            <br>
            <input type="checkbox" id="option" name="option"/>    
            <label for="option">Wiki</label>
            <br>
            <input type="checkbox" id="option" name="option"/>
            <label for="option">Forums</label>
            <br>
            <input type="checkbox" id="option" name="option"/>
            <label for="option">Additional Changes</label>
            <br>
            <br>
            <label for="comment-input">Any Comments or Suggestion ?</label>
            <br>
            <textarea class="name-comment" placeholder="Enter your comment here"></textarea>
            <br>
            <br>
          <footer>
            <button>Submit</button>
          </footer>
        </form>
            </div> 
    </main>
    </body>
</html>
